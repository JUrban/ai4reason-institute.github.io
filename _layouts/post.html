---
layout: default
---
<div class="pagehead">
  <div class="wrap">
    <p class="kicker"><a href="{{ '/news/' | relative_url }}">News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>{% if page.location %} · {{ page.location }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
    {% if page.byline %}<p class="byline">{{ page.byline }}</p>{% endif %}
  </div>
</div>
<article class="wrap prose pagebody">
  {{ content }}
  <p class="back"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
</article>
