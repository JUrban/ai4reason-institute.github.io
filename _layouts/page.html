---
layout: default
---
<div class="pagehead">
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</div>
<div class="wrap {% if page.wide %}wide{% else %}prose{% endif %} pagebody">
  {{ content }}
</div>
