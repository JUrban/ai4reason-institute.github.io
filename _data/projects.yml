# Research projects, grouped by theme. people: everyone credited (paper byline where there is a paper);
# institute researchers (site.members in _config.yml) are shown in bold. status is a short, honest state line.
- id: autoformalization
  name: "Autoformalization and formal mathematics"
  blurb: "Turning textbook mathematics into machine-checked libraries with LLM agents, proof checkers and automated provers."
  items:
    - title: "Formal topology in Megalodon: 130k lines in two weeks"
      desc: "Coding agents and Chad E. Brown’s Megalodon proof checker in a low-cost feedback loop produced about 130,000 lines of formal general topology (Munkres) in two weeks, for roughly USD 100 in subscriptions."
      url: "https://arxiv.org/abs/2601.03298"
      people: ["Josef Urban"]
      status: "ITP 2026 paper"
      extra:
        - {label: "Munkres in Megalodon", url: "https://github.com/mgwiki/mgw_test"}
    - title: "Agent Hunt: algebraic topology in Megalodon"
      desc: "Coding agents coordinate through a simulated bounty market: they propose statements, post bounties for useful lemmas and compete to prove them in Megalodon. The result is a very large partial formalization of Munkres’ algebraic topology (about 900,000 lines) covering fundamental groups, covering spaces, sphere topology and graph arguments, with a public record of statement corrections."
      url: "https://arxiv.org/abs/2603.06737"
      people: ["Chad E. Brown", "Cezary Kaliszyk", "Josef Urban"]
      status: "PAAR 2026 paper; substantial proof development, major theorem admissions remain"
      extra:
        - {label: "Megalodon development", url: "https://github.com/mgwiki/alg_top"}
        - {label: "statement corrections", url: "https://github.com/mgwiki/alg_top/blob/7346450c3ce88a2651fef3c2d7edde4b3fb4b6e5/forum/NOTICEBOARD.md"}
    - title: "Autoformalizing Godement’s Algebra in Megalodon"
      desc: "A large Godement algebra development records completion of its remaining represented proof obligations, including Jordan canonical form and spectral theorems."
      url: "https://github.com/mgwiki/god1"
      people: ["Josef Urban"]
      status: "Phase 3 completion recorded against the retained library"
    - title: "Classical mathematics and foundations for the Megalodon libraries"
      desc: "A shared set-theoretic library contains full written proofs of classical results and supplies the background for later textbook autoformalizations."
      url: "https://github.com/mgwiki/mgw_test"
      people: ["Josef Urban"]
      status: "Concrete closed proof scripts; independent replay pending"
    - title: "Autoformalizing general topology in Isabelle"
      desc: "An extensive Isabelle development translates general-topology textbook material into explicit statements and machine-oriented proofs."
      url: "https://github.com/JUrban/isa_top_autoform1"
      people: ["Dustin Bryant", "Jonathan Julián Huerta y Munive", "Cezary Kaliszyk", "Josef Urban"]
      status: "Large formalization; reported completion of the main target"
      extra:
        - {label: "paper: 806 results, 39 sections", url: "https://arxiv.org/abs/2604.07455"}
    - title: "Strengthening the statements of autoformalized topology"
      desc: "A follow-up Isabelle development adds explicit carrier and topology conditions and strengthens selected textbook theorem formulations."
      url: "https://github.com/JUrban/isa_top_autoform2"
      people: ["Josef Urban"]
      status: "Substantial strengthened development; one visible admitted counterexample remains"
    - title: "Autoformalizing algebraic topology in Isabelle"
      desc: "A layered Isabelle development covers fundamental groups, covering spaces, and planar topology, while continuing work on surface-classification arguments."
      url: "https://github.com/JUrban/isa_algtop1"
      people: ["Josef Urban"]
      status: "Extensive proved infrastructure; active surface-pasting obligations remain"
    - title: "Formalizing Moise’s geometric topology in Isabelle"
      desc: "The latest development closes the numbered theorem chain of Moise Sections 3–4 and documents its relationship to the textbook."
      url: "https://github.com/JUrban/isa_geotop1"
      people: ["Josef Urban"]
      status: "Selected section theorem chain closed in the development split"
    - title: "Autoformalizing metrizable-space paracompactness in HOL Light"
      desc: "A completed recorded development proves that every metrizable space is paracompact, with Michael’s lemma and refinement machinery."
      url: "https://github.com/JUrban/hol-light-autoformalize1"
      people: ["Josef Urban"]
      status: "Target theorem reported complete; concrete proof source available"
    - title: "Paracompactness formalization in Metamath"
      desc: "A Metamath extension supplies explicit derivations for refinement lemmas, Michael’s lemma, and the paracompactness of metric spaces."
      url: "https://github.com/JUrban/mm-set.mm-af1"
      people: ["Josef Urban"]
      status: "Full target proof text present; supporting verification recorded"
    - title: "AI-assisted formalization of Synthetic Stone Duality"
      desc: "A Cubical Agda experiment develops material from A Foundation for Synthetic Stone Duality and replaces selected postulates with proofs."
      url: "https://github.com/JUrban/FormalizationSSD-AI-attempts"
      people: ["Josef Urban"]
      status: "Substantial partial formalization; mathematical postulates remain"
    - title: "Translating HOL Light mathematics into Megalodon"
      desc: "HOL2MG translates mathematical statements, generates native proofs, and checks semantic bridges between HOL Light and Megalodon."
      url: "https://github.com/JUrban/hol2mg"
      people: ["Josef Urban"]
      status: "Large statement coverage and partial fully checked proof coverage"
- id: readable
  name: "Readable formal mathematics"
  blurb: "Proof assistants and tools that keep formal mathematics close to how mathematicians write and read it."
  items:
    - title: "Felix: a natural proof assistant"
      desc: "An experimental proof assistant for controlled mathematical English embedded in LaTeX, founded on higher-order Tarski–Grothendieck set theory, with a small proof kernel, ontological checking, calculational proofs and higher-order export to TPTP TH0. Its library has about 220,000 lines, 1,500 definitions and 8,100 theorem statements."
      url: "https://github.com/felixprover/felix"
      people: ["Adrian De Lon"]
      status: "Active development"
    - title: "Felix formalizations of Munkres’ Topology"
      desc: "Autoformalized textbook topology in Felix, from topological spaces to metrization and dimension theory, with an interactive HTML browser featuring expandable proofs, linked references and previews."
      url: "https://atlehahn.github.io/Felix-Formalizations/docs/index.html"
      people: ["Atle Hahn", "Adrian De Lon", "Josef Urban"]
      status: "Browsable online"
    - title: "Distilling autoformalized proofs"
      desc: "Automated refactoring that shortens machine-generated proofs while keeping them verifiable: a development through Urysohn’s lemma shrank from about 64,500 to 24,000 lines."
      url: "https://link.springer.com/chapter/10.1007/978-3-032-38214-6_5"
      people: ["Adrian De Lon", "Atle Hahn", "Josef Urban"]
      status: "CICM 2026 paper"
    - title: "Theorem Browser"
      desc: "A searchable collection of mathematical results and proofs, a step towards an “IMDb for mathematical proofs”, with filters by subject, importance and required background, built with Codex from Wikipedia’s mathematics articles."
      url: "https://github.com/AtleHahn/Theorem-Browser"
      people: ["Atle Hahn"]
      status: "Current project"
    - title: "Reinformalization with Informath"
      desc: "Turning Felix/Naproche autoformalizations back into natural mathematical prose with Grammatical Framework."
      url: "https://aitp-conference.org/2026/abstract/AITP_2026_paper_21.pdf"
      people: ["Adrian De Lon", "Aarne Ranta"]
      status: "AITP 2026 abstract"
    - title: "Palaver and multilingual glossing in GF"
      desc: "Multilingual language learning and interlinear glossing generated from shared Grammatical Framework representations."
      url: "https://aclanthology.org/2026.nlp4call-1.9/"
      people: ["Adrian De Lon", "Inari Listenmaa"]
      status: "NLP4CALL and KONVENS 2026"
- id: verified
  name: "Trustworthy proof and verified computation"
  blurb: "Re-checking landmark formal proofs on verified foundations and making proof certificates explicit."
  items:
    - title: "The Four Colour Theorem checked by Candle"
      desc: "A Candle port proves six formulations of the Four Colour Theorem using verified computation for the finite checks."
      url: "https://github.com/JUrban/candle-4ct"
      people: ["Josef Urban"]
      status: "Complete port reported with clean-run reproduction"
    - title: "Flyspeck on a verified theorem-proving stack"
      desc: "Coordinated Candle/CakeML development has completed the direct Flyspeck source workload and LP lane, with nonlinear verification still in progress."
      url: "https://github.com/JUrban/flyspeck-candle-project"
      people: ["Josef Urban"]
      status: "Direct source and LP milestones achieved; nonlinear closure incomplete"
      extra:
        - {label: "Candle", url: "https://github.com/JUrban/candle"}
        - {label: "CakeML", url: "https://github.com/JUrban/cakeml"}
        - {label: "Flyspeck fork", url: "https://github.com/JUrban/flyspeck"}
    - title: "The combinatorial Four Colour Theorem in HOL4"
      desc: "A curated HOL4 development checks the complete hypermap proof and finite configurations, with an explicit premise for its geometric graph extension."
      url: "https://github.com/JUrban/hol4-four-colour"
      people: ["Josef Urban"]
      status: "Hypermap theorem complete; graph extension conditional"
    - title: "Rechecking a Poincaré development in Candle"
      desc: "A Candle port reproduces the headline results and audits of an existing HOL Light Poincaré-conjecture development."
      url: "https://github.com/JUrban/Poincare"
      people: ["Josef Urban"]
      status: "Port and fresh-session comparison completed"
    - title: "Rechecking Navier–Stokes formalization results in Candle"
      desc: "A Candle run reproduces the checked results and statement definitions of an existing HOL Light development concerning forced Navier–Stokes blowup."
      url: "https://github.com/JUrban/Navier_Stokes"
      people: ["Josef Urban"]
      status: "Port and cross-system result comparisons completed"
    - title: "Executable Standard ML for Atlas representation-theory computations"
      desc: "An SML replacement runs a key Atlas verification workflow, while HOL4/CakeML work makes its remaining semantic obligations explicit."
      url: "https://github.com/JUrban/atlasofliegroups_sml1"
      people: ["Mario Carneiro", "Stephen D. Miller", "Magnus Myreen", "Josef Urban"]
      status: "Executable F4 workflow achieved; full formal equivalence remains open"
      extra:
        - {label: "paper draft", url: "https://github.com/JUrban/atlas_auto_paper"}
    - title: "Explicit Vampire certificates for Megalodon"
      desc: "Vampire exports small, typed proof operations that Megalodon can verify and elaborate without reconstructing missing search decisions."
      url: "https://github.com/JUrban/vampire"
      people: ["Josef Urban"]
      status: "Bounded end-to-end certificate checks demonstrated"
    - title: "mm-lean4: a verified Metamath verifier"
      desc: "A Lean 4 Metamath verifier with formal soundness and completeness results, parser-correctness developments and verification of the full set.mm library, plus a specification-driven and adversarial test suite."
      url: "https://github.com/zariuq/mm-lean4"
      people: ["Zar Goertzel"]
      status: "AITP 2026 abstract"
      extra:
        - {label: "test suite", url: "https://github.com/zariuq/metamath-test"}
    - title: "Exporting Megalodon mathematics to Dedukti"
      desc: "A translator and generated examples expose Megalodon terms and proofs in Dedukti, preserving an explicit distinction between proof bodies and assumed declarations."
      url: "https://github.com/mgwiki/ded1"
      people: ["Josef Urban"]
      status: "Translator and substantial exports available; independent replay pending"
    - title: "PAS: assembling and checking formal proof documents"
      desc: "A populated OCaml proof-assembler prototype reads Proofgold documents, checks them against a theory and prior documents, and supports serialized input."
      url: "https://github.com/mgwiki/pas"
      people: ["Josef Urban"]
      status: "Substantial prototype implementation and example documents"
    - title: "Megalodon support for formal libraries and proof certificates"
      desc: "Checker and export development supports the mgwiki mathematics libraries, while experimental branches investigate checked Vampire integration."
      url: "https://github.com/mgwiki/Megalodon"
      people: ["Josef Urban"]
      status: "Library-support changes implemented; reviewed certificate branch remains experimental"
- id: learning
  name: "Learning and automated reasoning"
  blurb: "Machine learning inside theorem provers: guidance, conjecturing, premise selection, benchmarks and large proof searches."
  items:
    - title: "Commutative AIM loops are nilpotent of class 3"
      desc: "Robert Veroff’s 40-day Bigloop/Prover9 run found a 30,835-clause proof that AIM + commutativity implies nilpotency class 3, one of the most complex results ever obtained with Prover9."
      url: "/veroff-aim-proof/"
      people: ["Robert Veroff"]
      status: "Completed 2025"
    - title: "Scaling Prover9 and checking large proof recipes"
      desc: "Memory and indexing improvements preserve large proof searches, while a separate replay mode checks known proofs efficiently."
      url: "https://github.com/JUrban/Prover9-new"
      people: ["Josef Urban"]
      status: "Full proof endpoints and checked replay demonstrated"
    - title: "Learning and hint guidance for Twee"
      desc: "Equation hints, learned rule guidance, and online proof reuse improve equational theorem proving on the AIM60k benchmark."
      url: "https://github.com/JUrban/twee-hints1"
      people: ["Josef Urban"]
      status: "Implemented and benchmarked; experiments continuing"
    - title: "AIM60k: a benchmark for difficult equational reasoning"
      desc: "A public benchmark of 51,784 theorem-proving problems derived from long Prover9 proofs in loop theory, with a further private evaluation set."
      url: "https://github.com/JUrban/AIM60k"
      people: ["Robert Veroff", "Josef Urban"]
      status: "Released benchmark"
    - title: "Learning useful intermediate lemmas for automated proof search"
      desc: "Graph-based neural models generate candidate cuts and test whether proving and using them reduces automated proof-search work."
      url: "https://github.com/JUrban/E_conj_dev1"
      people: ["Karel Chvalovský", "Martin Suda", "Josef Urban"]
      status: "Implemented and evaluated on held-out problems"
      extra:
        - {label: "IWIL 2026 paper", url: "https://easychair.org/publications/paper/HcmX"}
    - title: "Teaching Vampire new tricks"
      desc: "An experimental study of neural clause selection in Vampire across benchmarks and strategies, and of how learned guidance transfers between domains."
      url: "https://arxiv.org/abs/2609.16228"
      people: ["Karel Chvalovský", "Martin Suda", "Josef Urban"]
      status: "LPAR 2026 paper"
    - title: "PLN-based premise selection"
      desc: "Probabilistic Logic Networks for premise selection, evaluated against MaSh baselines with E and Vampire on extended MPTP benchmarks."
      url: "https://github.com/zariuq/MeTTapedia"
      people: ["Zar Goertzel"]
      status: "Working manuscript"
    - title: "Program synthesis for integer sequences"
      desc: "Self-learning synthesis of programs for OEIS sequences, program generation as an evolution operator, and automated and human explanations of the resulting “alien codes”."
      url: "https://aitp-conference.org/2026/abstract/AITP_2026_paper_17.pdf"
      people: ["Thibault Gauthier", "Josef Urban", "Mirek Olšák"]
      status: "AITP 2026 and SCML 2026"
    - title: "Archived Vampire conjecturing experiments"
      desc: "Inputs, prover outputs, and result lists preserve an initial conjecturing and AVATAR experiment on Mizar problems."
      url: "https://github.com/JUrban/V_conj1"
      people: ["Josef Urban"]
      status: "Substantial artifacts; evaluation protocol incomplete"
    - title: "Mizar60 premise-selection data"
      desc: "Proof dependencies and first-order formulas support training and evaluation of premise selection for large mathematical libraries."
      url: "https://github.com/JUrban/Mizar60_minimized"
      people: ["Josef Urban"]
      status: "Released dependency and problem artifacts"
    - title: "A formal conjecture library and bounty workflow"
      desc: "A structured collection of formal problem files connects theorem-prover benchmarks, generated conjectures, and proof-publication infrastructure."
      url: "https://github.com/mgwiki/mgw_test"
      people: ["Josef Urban"]
      status: "Substantial public problem corpus and publication workflow"
    - title: "Reliability fixes for the E theorem prover"
      desc: "Focused branches repair ordering, indexing, and boundary-condition defects in the E automated theorem prover."
      url: "https://github.com/JUrban/eprover-debug1"
      people: ["Josef Urban"]
      status: "Implemented fixes and focused regression evidence"
    - title: "Mizar checking and absolute library exports in Rust"
      desc: "A Rust-based Mizar checker fork adds library patches and export support useful for automated-reasoning experiments."
      url: "https://github.com/JUrban/mizar-rs"
      people: ["Josef Urban"]
      status: "Checker fork and substantial library patch available"
- id: agentic
  name: "AI for mathematical research"
  blurb: "Time-boxed experiments in which AI agents attack open problem collections, with full records of claims, corrections and review."
  items:
    - title: "Forty-eight hours with the Kourovka Notebook"
      desc: "A documented AI research experiment produces and reviews candidate arguments for group-theory problems, preserving corrections and attribution."
      url: "https://github.com/JUrban/kour1"
      people: ["Josef Urban", "Michael Kinyon"]
      status: "Candidate results documented; one withdrawn; specialist validation varies"
    - title: "A second AI investigation of Kourovka problems"
      desc: "A separate 48-hour Claude-based experiment records five claimed complete answers, partial results, and reproducible finite computations."
      url: "https://github.com/JUrban/kour1cl"
      people: ["Josef Urban", "Michael Kinyon"]
      status: "Candidate arguments and bounded computations documented"
    - title: "Forty-eight hours with GroupWorld"
      desc: "A time-bounded AI research experiment investigates a group-theory problem collection and publishes candidate proofs, computations, and a detailed scope ledger."
      url: "https://github.com/JUrban/gworld1"
      people: ["Josef Urban", "Michael Kinyon", "Vladimir Shpilrain"]
      status: "Ten whole-entry candidates and two partial entries; specialist review pending"
    - title: "Evaluating AI feedback on linear-algebra homework"
      desc: "A held-out comparison of 2,064 homework submissions measures grading agreement and identifies useful second-reader behavior and calibration limits."
      url: "https://github.com/JUrban/lina1"
      people: ["Josef Urban"]
      status: "Substantial evaluation; aggregate grading baseline remains stronger"
- id: foundations
  name: "Foundations of inference and reasoning languages"
  blurb: "Formal foundations of probabilistic inference and runtimes for symbolic reasoning languages."
  items:
    - title: "Knuth–Skilling foundations of inference"
      desc: "A Lean formalization of the Knuth–Skilling foundations of inference that identifies the extra hypotheses needed for the representation arguments and proves counterexamples when they are omitted."
      url: "https://github.com/zariuq/ks-foundations-of-inference"
      people: ["Zar Goertzel"]
      status: "Formal development"
    - title: "World-Model Calculus for PLN"
      desc: "WM-PLN separates evidence revision, probabilistic readouts and inference rules justified by explicit model assumptions, with formal links to Bayesian networks, ProbLog and Markov logic."
      url: "https://github.com/zariuq/MeTTapedia"
      people: ["Zar Goertzel"]
      status: "Working manuscript"
    - title: "CeTTa: a C runtime for MeTTa"
      desc: "A direct C runtime for the MeTTa language family with symbolic rewriting, nondeterministic search, indexed spaces and Python interoperability."
      url: "https://github.com/zariuq/CeTTa"
      people: ["Zar Goertzel"]
      status: "Working manuscript"
    - title: "MeTTapedia"
      desc: "Manuscripts and Lean developments on operational semantics, process calculi, OSLF, GSLT2GSLT typed action decoding and predictive coding."
      url: "https://github.com/zariuq/MeTTapedia"
      people: ["Zar Goertzel"]
      status: "Repository"
- id: tools
  name: "Research practice and tools"
  blurb: "Infrastructure for running, recording and evaluating AI-assisted research."
  items:
    - title: "Evidence Commons: evaluating and funding AI-assisted research"
      desc: "A proposal and reference implementation explore claim evaluation, contribution records, and funding based on demonstrated research value."
      url: "https://github.com/JUrban/evidence-commons"
      people: ["Josef Urban"]
      status: "Design, tools, and simulations available; field pilots unvalidated"
    - title: "A versioned knowledge base of claims and evidence"
      desc: "A structured snapshot preserves claims, evidence, assessments, relationships, and source provenance with stable identities and integrity checks."
      url: "https://github.com/JUrban/kb-fc1"
      people: ["Josef Urban"]
      status: "Substantial exported knowledge-base snapshot"
    - title: "Reading and reviewing AI research session histories"
      desc: "A local web viewer makes large Codex and Claude Code histories navigable, with bounded loading, selected-session exposure, and optional interaction."
      url: "https://github.com/JUrban/codex_viewer"
      people: ["Josef Urban"]
      status: "Usable implementation with tests and documented architecture"
    - title: "Serving a reasoning model on the Vera GPU cluster"
      desc: "A tested runbook and launch scripts deploy ThinkingCap with vLLM and connect it to Qwen Code on shared research hardware."
      url: "https://github.com/JUrban/vera-thinkingcap1"
      people: ["Josef Urban"]
      status: "Tested deployment recipe and reusable scripts"
