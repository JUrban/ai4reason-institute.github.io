    url: https://www.cse.chalmers.se/~aarne/
    initials: AR
    bio: >-
      Creator of Grammatical Framework. Joint work with Adrian De Lon on turning Felix
      autoformalizations back into natural mathematical language with Informath.
  - name: Michael Kinyon
    id: michael-kinyon
    role: Visitor 2026
    aff: Professor of Mathematics, University of Denver, USA
    inst: University of Denver
    initials: MK
    bio: >-
      Algebraist working on loops and quasigroups, including the AIM conjecture. Co-author of the
      48-hour Kourovka Notebook and GroupWorld experiments in agentic mathematical research.
  - name: Robert Veroff
    id: robert-veroff-visit
    role: Visitor 2026
    aff: Professor Emeritus, University of New Mexico, USA
    inst: University of New Mexico
    url: https://www.cs.unm.edu/~veroff/
    initials: RV
    bio: >-
      Chair of the AI4REASON Board. Large-scale Prover9 proof search and the AIM project.
