  authors: ["Adrian De Lon", "Aarne Ranta"]
  people: ["Adrian De Lon"]
  venue: "AITP 2026, Aussois · abstract and talk"
  summary: "This work turns autoformalized mathematics back into readable mathematical language using symbolic rules. Felix/Naproche supplies formal input and Informath, implemented with Grammatical Framework, supplies a linguistic representation. The case study on topology investigates how to reduce the verbosity of a literal rendering while keeping a transparent connection to the checked source."
