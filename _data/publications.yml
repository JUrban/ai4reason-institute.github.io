- id: atlas-equivalence
  group: talk
  sort: 2026-09-04
  date: "AITP 2026"
  title: "Autoformalizing Fast–Slow Equivalence Proofs for Atlas Computations in the Unitary Dual Problem"
  authors: ["Mario Carneiro", "Stephen D. Miller", "Magnus Myreen", "Josef Urban"]
  people: ["Josef Urban"]
  venue: "AITP 2026, Aussois · extended abstract"
  summary: "Atlas computations in representation theory rely on optimized algorithms whose mathematical behavior must agree with simpler reference versions. This contribution studies autoformalization of the required fast–slow equivalence arguments, connecting executable computations with formal verification. The work targets trust in computational evidence for the unitary dual problem; it does not establish that all Atlas algorithms or the full underlying computation have been verified."
  links:
    - {label: "abstract", url: "https://aitp-conference.org/2026/abstract/AITP_2026_paper_36.pdf"}
