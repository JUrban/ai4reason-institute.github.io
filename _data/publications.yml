    - {label: "slides", url: "https://aitp-conference.org/2026/slides/MS.pdf"}
- id: groupworld-report
  group: manuscript
  sort: 2026-09-30
  date: "September 2026"
  title: "Forty-eight hours with GroupWorld: an experiment in agentic mathematical research"
  authors: ["Codex gpt-6-astra", "Michael Kinyon", "Josef Urban", "Vladimir Shpilrain"]
  people: ["Josef Urban"]
  venue: "Repository manuscript (version 1)"
  summary: "The GroupWorld report presents another 48-hour research experiment, combining group-theoretic arguments, exact programs, GAP, selected Lean work, and literature checks. Its deadline record distinguishes proposed coverage of complete entries from partial results and already known subparts. The manuscript exposes dependencies and limitations so that specialists can assess correctness and novelty."
