  authors: ["Adrian De Lon", "Atle Hahn"]
  people: ["Adrian De Lon", "Atle Hahn"]
  venue: "AITP 2026, Aussois · abstract and talk"
  summary: "These experiments autoformalize topology in Felix while treating readability and source fidelity as central research questions. Controlled mathematical English and automated theorem proving let agents state human-sized proof steps, then refine them through a generate–check–repair loop. The contribution also examines post-processing and presentation of the resulting development so that machine-checked texts remain open to human review."
