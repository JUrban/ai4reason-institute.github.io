- id: palaver
  group: paper
  sort: 2026-11-19
  date: "NLP4CALL 2026"
  title: "Multilingual language learning with Grammatical Framework"
  authors: ["Adrian De Lon", "Inari Listenmaa"]
  people: ["Adrian De Lon"]
  venue: "NLP4CALL 2026, Gothenburg · pp. 111–118"
  summary: "Palaver is a multilingual language-learning prototype built with Haskell and Grammatical Framework. Shared grammatical representations generate phrases, translations, glosses, and answer alternatives. Learning progress and spaced repetition persist when the learner changes the supporting language. The paper describes demonstration courses in seven languages and explores how one structured representation can support both teaching material and answer checking."
  links:
    - {label: "paper", url: "https://aclanthology.org/2026.nlp4call-1.9/"}
    - {label: "PDF", url: "https://aclanthology.org/2026.nlp4call-1.9.pdf"}
- id: neural-conjecturing-published
  group: paper
  sort: 2026-10-24
  date: "IWIL 2026"
  title: "Neural Conjecturing for Saturation Theorem Provers"
  authors: ["Karel Chvalovský", "Martin Suda", "Josef Urban"]
  people: ["Josef Urban"]
  venue: "IWIL 2026 · Kalpa Publications in Computing 23, pp. 10–20"
  summary: "A graph neural network proposes intermediate lemmas that restructure saturation-based proof search. Candidate cuts are accepted only when automated provers discharge both branches. Experiments on Mizar-derived problems study speedups in E and transfer to Vampire through AVATAR claims. The work couples learned conjecture generation to logical validation and a feedback loop for training."
  links:
    - {label: "paper", url: "https://easychair.org/publications/paper/HcmX"}
    - {label: "slides", url: "https://aitp-conference.org/2026/slides/JU1.pdf"}
- id: epr-second-player
  group: paper
  sort: 2026-10-23
  date: "LPAR 2026"
  title: "Reintroducing the Second Player in EPR"
  authors: ["Leroy Chew", "Mikoláš Janota", "Mirek Olšák", "Martin Suda"]
  people: ["Mirek Olšák"]
  venue: "LPAR 2026 · EPiC Series in Computing 112, pp. 61–79"
  summary: "The paper identifies a first-order fragment, QEALM, whose satisfiability problem retains a QBF-like alternating game interpretation. It establishes PSPACE completeness and restrictions corresponding to levels of the polynomial hierarchy, then classifies relevant TPTP problems. The result gives a more structured account of computational complexity inside effectively propositional reasoning."
  links:
    - {label: "arXiv", url: "https://arxiv.org/abs/2602.16410"}
    - {label: "DOI", url: "https://easychair.org/publications/paper/4vvj"}
- id: teaching-vampire
  group: paper
  sort: 2026-10-23
  date: "LPAR 2026"
  title: "Teaching Vampire New Tricks: An Experimental Study of Neural Clause Selection"
  authors: ["Karel Chvalovský", "Martin Suda", "Josef Urban"]
  people: ["Josef Urban"]
  venue: "LPAR 2026 · EPiC Series in Computing 112, pp. 42–60"
  summary: "This study examines neural clause selection in Vampire across benchmarks derived from interactive proof libraries and across proving strategies. Learned guidance helps within domains, while transferring a model between domains can be less effective. Training across datasets mitigates that weakness. The experiments also show why gains for a single strategy need to be assessed again when the prover runs a stronger strategy portfolio."
  links:
    - {label: "arXiv", url: "https://arxiv.org/abs/2609.16228"}
    - {label: "DOI", url: "https://easychair.org/publications/paper/vLFt"}
