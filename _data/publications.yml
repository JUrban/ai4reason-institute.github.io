- id: distilling-proofs
  group: paper
  sort: 2026-09-29
  date: "CICM 2026"
  title: "Distilling Autoformalized Proofs"
  authors: ["Adrian De Lon", "Atle Hahn", "Josef Urban"]
  people: ["Adrian De Lon", "Atle Hahn", "Josef Urban"]
  venue: "CICM 2026 · LNCS 16907, pp. 75–92, Springer"
  summary: "Large autoformalizations can be correct yet too verbose to read comfortably. This work studies proof refactoring in Felix, combining automated theorem proving with checks that preserve verification. On a topology development through Urysohn’s lemma, the reported reduction is from approximately 64,500 to 24,000 lines. The paper treats readability, proof structure, and traceability to the informal source as goals alongside successful checking."
  links:
    - {label: "DOI", url: "https://link.springer.com/chapter/10.1007/978-3-032-38214-6_5"}
