  title: "LLM2SMT: Building an SMT Solver with Zero Human-Written Code"
  authors: ["Mikoláš Janota", "Mirek Olšák"]
  people: ["Mirek Olšák"]
  venue: "arXiv 2603.06931 · SMT 2026"
  summary: "LLM2SMT studies whether coding agents can build a working SMT solver under human direction without human-written implementation code. The resulting solver handles quantifier-free equality with uninterpreted functions using a DPLL(T) architecture and congruence closure. It also produces Lean proofs for unsatisfiable inputs. The paper documents the development process and the verification role of generated proof artifacts."
  links:
    - {label: "arXiv", url: "https://arxiv.org/abs/2603.06931"}
- id: cvc5-quantifier-selection
  group: paper
  sort: 2026-02-01
  date: "February 2026"
  title: "Machine learning for quantifier selection in cvc5"
  authors: ["Jan Jakubův", "Mikoláš Janota", "Jelle Piepenbrock", "Josef Urban"]
  people: ["Josef Urban"]
  venue: "International Journal of Approximate Reasoning 189"
  summary: "This journal article integrates fast learned guidance into cvc5’s quantifier instantiation process. Gradient-boosted decision trees help the solver choose which quantified formulas to instantiate during a run. Evaluation uses problems derived from Mizar and HOL4, including individual strategies and portfolios. The contribution connects statistical guidance to a working SMT solver while retaining its underlying logical reasoning."
  links:
