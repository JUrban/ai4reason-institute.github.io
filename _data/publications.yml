  title: "Felix: a Scalable Natural Proof Assistant"
  authors: ["Adrian De Lon"]
  people: ["Adrian De Lon"]
  venue: "AITP 2026, Aussois · system presentation"
  summary: "Felix develops a natural-language-oriented proof assistant for larger mathematical libraries and faster autoformalization cycles. The presentation introduces improvements to parsing and the proof language, more efficient internal processing, parallel automated-prover calls, and caching. It connects readable mathematical exposition with automated checking and provides the system context for the topology and proof-distillation experiments."
